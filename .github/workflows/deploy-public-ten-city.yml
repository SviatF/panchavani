name: Deploy 10 reviewed evergreen city guides to public Cloudflare (main only)
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'data/city-guides.json'
      - 'data/muhurat-guides.json'
      - 'data/approved-learning-seo.json'
      - 'scripts/test-learning-seo-release.mjs'
      - 'scripts/generate-learning-review-queue.mjs'
      - 'scripts/test-product-experience.mjs'
      - 'data/approved-panchang.json'
      - 'data/approved-seo-days.json'
      - 'data/approved-topic-pages.json'
      - 'data/approved-topic-seo.json'
      - 'scripts/assert_first_ten_public_release.py'
      - 'lib/seo-day-release-policy.mjs'
      - 'scripts/approved-day-value-gate.mjs'
      - 'scripts/generate-topic-pages.mjs'
      - 'lib/topic-release-policy.mjs'
      - 'lib/public-topics.ts'
      - 'components/reviewed-topic-page.tsx'
      - 'scripts/generate-reviewed-pages.mjs'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-public-ten-city.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'data/city-guides.json'
      - 'data/approved-panchang.json'
      - 'data/approved-topic-pages.json'
      - 'data/approved-topic-seo.json'
      - 'scripts/assert_first_ten_public_release.py'
      - '.github/workflows/deploy-public-ten-city.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: panchavani-public-first-ten
  cancel-in-progress: false
jobs:
  ten-city-controlled-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PANCHAVANI_APPROVED_RELEASE_SHA256: ${{ secrets.PANCHAVANI_APPROVED_RELEASE_SHA256 }}
      PANCHAVANI_APPROVED_SEO_RELEASE_SHA256: ${{ secrets.PANCHAVANI_APPROVED_SEO_RELEASE_SHA256 }}
      PANCHAVANI_APPROVED_TOPIC_RELEASE_SHA256: ${{ secrets.PANCHAVANI_APPROVED_TOPIC_RELEASE_SHA256 }}
      PANCHAVANI_APPROVED_TOPIC_SEO_SHA256: ${{ secrets.PANCHAVANI_APPROVED_TOPIC_SEO_SHA256 }}
      PANCHAVANI_APPROVED_LEARNING_SEO_SHA256: ${{ secrets.PANCHAVANI_APPROVED_LEARNING_SEO_SHA256 }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify source-backed editorial substance and not-too-similar city copy
        run: npm run audit:content
      - name: Verify ten-city selection and substantive, unindexed Muhurat guides
        run: npm run test:product
      - name: Generate exact content-hash reviewer queue (never grants SEO signoff)
        run: npm run audit:learning -- --out /tmp/panchavani-learning-review-queue.json
      - name: Upload private-editor review queue for 3 educational guides
        uses: actions/upload-artifact@v4
        with:
          name: panchavani-learning-three-article-human-review-UNAPPROVED
          path: /tmp/panchavani-learning-review-queue.json
          retention-days: 30
      - name: Build real static site
        run: npm run build
      - name: Validate reviewed city daily, calendar, festival, vrat and muhurat SEO releases before deploying
        run: python scripts/assert_first_ten_public_release.py
      - name: Require configured GitHub Cloudflare credentials for main deploy
        id: auth
        run: |
          if test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare GitHub secrets are missing; main deploy must FAIL' >&2
          fi
      - name: Fail closed when main is missing authenticated Cloudflare production deploy access
        if: github.ref == 'refs/heads/main' && steps.auth.outputs.ready != 'true'
        run: exit 1
      - name: Deploy ONLY validated public static out/ assets to Cloudflare Workers
        id: deploy
        if: github.ref == 'refs/heads/main' && steps.auth.outputs.ready == 'true'
        run: |
          npx wrangler deploy --config wrangler.jsonc
          echo 'deployed=true' >> "$GITHUB_OUTPUT"
      - name: Report factual release status
        if: always()
        env:
          PUBLISHING: ${{ steps.deploy.outputs.deployed }}
        run: |
          echo '## PANCHAVANI — first ten educational city URLs' >> "$GITHUB_STEP_SUMMARY"
          if test "$PUBLISHING" = true; then
            echo 'Cloudflare Worker deployed a fully release-audited index/sitemap: ten guides plus any independently reviewed daily or topical URLs. Confirm live HTTP and Google Search Console separately.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'NOT DEPLOYED. Pull request or blocked tests/credentials. Never claim Google indexing.' >> "$GITHUB_STEP_SUMMARY"
          fi
