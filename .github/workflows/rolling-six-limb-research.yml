name: PANCHAVANI TEN-city six-limb research previews (DAILY / UNAPPROVED)
on:
  schedule:
    - cron: '41 04 * * *'
  workflow_dispatch:
    inputs:
      start:
        description: India-local first date YYYY-MM-DD (empty = tomorrow IST)
        required: false
        default: ''
        type: string
  push:
    paths:
      - '.github/workflows/rolling-six-limb-research.yml'
      - 'engine/panchavani/first_six_limb_pilot.py'
      - 'engine/panchavani/rolling_day_previews.py'
      - 'engine/tests/test_rolling_day_previews.py'
      - 'engine/tests/test_ten_city_six_limb_research.py'
      - 'engine/panchavani/muhurat_windows.py'
      - 'engine/tests/test_muhurat_windows.py'
      - 'engine/panchavani/sourced_muhurat_rules.py'
      - 'engine/tests/test_sourced_muhurat_rules.py'
      - 'engine/fixtures/muhurat-reference-rulebook-DRAFT.json'
  pull_request:
    paths:
      - '.github/workflows/rolling-six-limb-research.yml'
      - 'engine/panchavani/first_six_limb_pilot.py'
      - 'engine/panchavani/rolling_day_previews.py'
      - 'engine/tests/test_rolling_day_previews.py'
      - 'engine/tests/test_ten_city_six_limb_research.py'
permissions:
  contents: read
concurrency:
  group: panchavani-rolling-ten-city-six-limb-research
  cancel-in-progress: false
jobs:
  six-limb-city-research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove future-date rolling invariants and non-indexability
        run: |
          cd engine
          python -m unittest discover -s tests -p 'test_rolling_day_previews.py' -v
          python -m unittest discover -s tests -p 'test_ten_city_six_limb_research.py' -v
          python -m unittest discover -s tests -p 'test_muhurat_windows.py' -v
          python -m unittest discover -s tests -p 'test_sourced_muhurat_rules.py' -v
          python -m unittest discover -s tests -p 'test_first_six_limb_pilot.py' -v
      - name: Determine tomorrow in India (or explicit date)
        id: day
        env:
          REQUESTED_START: ${{ inputs.start }}
        run: |
          python - <<'PY'
          import os
          from datetime import date,datetime,timedelta
          from zoneinfo import ZoneInfo
          value=os.environ.get('REQUESTED_START','').strip()
          day=date.fromisoformat(value) if value else datetime.now(ZoneInfo('Asia/Kolkata')).date()+timedelta(days=1)
          assert 2020<=day.year<=2099
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('day='+day.isoformat()+'\n')
          print('Research pilot begins India-local',day.isoformat())
          PY
      - name: Install pinned astronomical dependencies
        run: pip install -r engine/requirements.txt
      - name: Verify exact NASA/JPL DE440s kernel SHA-256
        run: |
          curl --fail --location --retry 3 --max-time 240 --silent --show-error \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp \
            --output /tmp/de440s.bsp
          echo 'c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2  /tmp/de440s.bsp' | sha256sum --check
      - name: Compute real JPL six-limb sunrise-based 10-city x 2-day research cohort
        run: |
          PYTHONPATH=engine python -m panchavani.first_six_limb_pilot \
            --cities ten --start '${{ steps.day.outputs.day }}' --ephemeris /tmp/de440s.bsp \
            --out engine/artifacts/rolling-six-limb-UNAPPROVED.json
      - name: Twenty human-review astronomy briefs only, no AI or public pages
        run: |
          PYTHONPATH=engine python -m panchavani.rolling_day_previews \
            --batch engine/artifacts/rolling-six-limb-UNAPPROVED.json \
            --out engine/artifacts/rolling-six-city-preview-index-UNAPPROVED.json \
            --previews engine/artifacts/rolling-city-briefs
      - name: Build private 4-limb time intersections for Wedding and Vehicle research
        run: |
          PYTHONPATH=engine python -m panchavani.muhurat_windows \
            --batch engine/artifacts/rolling-six-limb-UNAPPROVED.json \
            --out engine/artifacts/ten-city-muhurat-time-grid-UNAPPROVED.json
      - name: Apply versioned sourced Wedding and Vehicle screens without making auspicious claims
        run: |
          PYTHONPATH=engine python -m panchavani.sourced_muhurat_rules \
            --grid engine/artifacts/ten-city-muhurat-time-grid-UNAPPROVED.json \
            --rules engine/fixtures/muhurat-reference-rulebook-DRAFT.json \
            --out engine/artifacts/ten-city-muhurat-sourced-screening-UNAPPROVED.json
      - name: Check twenty distinct city-day astronomy records, science integrity and no release
        run: |
          python - <<'PY'
          import json,os,hashlib,pathlib
          root=pathlib.Path('engine/artifacts')
          report=json.loads((root/'rolling-six-city-preview-index-UNAPPROVED.json').read_text())
          src=(root/'rolling-six-limb-UNAPPROVED.json').read_bytes()
          assert report['jplResearchBatchSha256']==hashlib.sha256(src).hexdigest()
          assert report['cityCount']==10 and report['cityDays']==20 and report['fourLimbDawnChecks']==40
          assert report['status']=='UNAPPROVED_RESEARCH'
          assert not report['scientificApproval'] and not report['publicationAuthorized']
          assert not report['indexingAuthorized'] and not report['modelInvocationAuthorized']
          assert report['approvedClaimsForDeepSeek']==[]
          timegrid=json.loads((root/'ten-city-muhurat-time-grid-UNAPPROVED.json').read_text())
          assert timegrid['cityCount']==10 and timegrid['cityDays']==20
          assert len(timegrid['windows'])==20
          assert timegrid['scientificApproval'] is False
          assert timegrid['muhuratRecommendationsAuthorized'] is False
          assert timegrid['approvedClaimsForDeepSeek']==[]
          assert timegrid['indexingAuthorized'] is False
          assert timegrid['publicationAuthorized'] is False
          screening=json.loads((root/'ten-city-muhurat-sourced-screening-UNAPPROVED.json').read_text())
          assert screening['cityCount']==10 and screening['metrics']['cityDaysValidated']==20
          assert screening['metrics']['maximumSunriseChainErrorSeconds']<=0.001
          assert screening['metrics']['maximumDurationErrorSeconds']<=0.001
          assert screening['analysis']['wedding']['testedCityDays']==20
          assert screening['analysis']['vehicle-purchase']['testedCityDays']==20
          assert screening['analysis']['wedding']['qualifyingWeddingOrPurchaseMuhuratCount']==0
          assert screening['analysis']['vehicle-purchase']['qualifyingWeddingOrPurchaseMuhuratCount']==0
          assert screening['approvedClaimsForDeepSeek']==[]
          assert screening['muhuratRecommendationsAuthorized'] is False
          assert screening['publicationAuthorized'] is False
          assert screening['indexingAuthorized'] is False
          assert len(screening['rulebookSha256'])==64
          assert sum(row['windowCount'] for row in timegrid['windows'])>=20
          assert len({p['previewSha256'] for p in report['records']})==20
          assert len({p['modeledSunriseIST'] for p in report['records']})==20
          assert len(list((root/'rolling-city-briefs').glob('*-UNAPPROVED.md')))==20
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
            out.write('## PANCHAVANI nightly: 6-limb / TEN-city / 2-day research preview\n\n')
            out.write('**Still blocked from public release, paid generation and automatic scientific approval.**\n\n')
            out.write('| City | Local date | JPL sunrise IST | Astronomical changes | Reviewed? |\n')
            out.write('|---|---|---|---:|---|\n')
            for p in report['records']:
              out.write(f"| {p['cityId']} | {p['localDate']} | {p['modeledSunriseIST']} | {p['changeCount']} | NO |\n")
            out.write('\nCity observers, Lahiri and private D1 source hashes still require scientific review.\n')
            out.write('\n### Sourced Wedding/Vehicle screening — NOT approved Muhurats\n\n')
            out.write('| Profile | Raw research windows meeting basic filters | Unverified conditions | Authorized auspicious dates |\n')
            out.write('|---|---:|---:|---:|\n')
            for kind in ('wedding','vehicle-purchase'):
              p=screening['analysis'][kind]
              out.write(f"| {kind} | {p['initialSurvivingWindows']} | {len(p['remainingIndependentChecks'])} | {p['qualifyingWeddingOrPurchaseMuhuratCount']} |\n")
            out.write('\n**Rahu:** 1 of 8 locally computed daylight segments by weekday. **Vehicle:** conservative 21:00 IST trim; **Wedding:** 11 Nakshatra reference group, 9 prohibited Yoga (whole-period provisional veto), 4 Karana exclusions and uncomputed Pada/Asta/solar-month blocks. No DeepSeek generation or indexing rights.\n')
          print('PASS: TWENTY location-unique JPL research previews, zero public pages')
          PY
      - name: Mirror 20 complete research records to PRIVATE R2 only (no D1 overwrite or publication)
        if: github.ref == 'refs/heads/main'
        env:
          R2_ACCOUNT_ID: ${{ secrets.PANCHAVANI_R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PANCHAVANI_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PANCHAVANI_R2_SECRET_ACCESS_KEY }}
          SNAPSHOT_DATE: ${{ steps.day.outputs.day }}
        run: |
          set -euo pipefail
          if test -z "$R2_ACCOUNT_ID" || test -z "$AWS_ACCESS_KEY_ID" || test -z "$AWS_SECRET_ACCESS_KEY"; then
            echo 'PRIVATE R2 MIRROR NOT ACTIVE: repository R2 credentials absent. GitHub artifact still contains science report.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          key="ops/ten-city-six-limb/v1/$SNAPSHOT_DATE/$GITHUB_RUN_ID"
          aws s3 cp engine/artifacts/rolling-six-limb-UNAPPROVED.json \
            "s3://panchavani-research-private/$key/science-UNAPPROVED.json" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --no-progress
          aws s3 cp engine/artifacts/rolling-six-city-preview-index-UNAPPROVED.json \
            "s3://panchavani-research-private/$key/preview-index-UNAPPROVED.json" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --no-progress
          aws s3 cp engine/artifacts/ten-city-muhurat-time-grid-UNAPPROVED.json \
            "s3://panchavani-research-private/$key/muhurat-interval-grid-UNAPPROVED.json" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --no-progress
          aws s3 cp engine/artifacts/ten-city-muhurat-sourced-screening-UNAPPROVED.json \
            "s3://panchavani-research-private/$key/sourced-rule-screening-UNAPPROVED.json" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --no-progress
          echo "PRIVATE R2 SNAPSHOT STORED: immutable research namespace $key (NOT an approved candidate, no release)." >> "$GITHUB_STEP_SUMMARY"
      - name: Archive private-only research; do not deploy
        uses: actions/upload-artifact@v4
        with:
          name: panchavani-rolling-ten-city-six-limb-UNAPPROVED
          path: |
            engine/artifacts/rolling-six-limb-UNAPPROVED.json
            engine/artifacts/rolling-six-city-preview-index-UNAPPROVED.json
            engine/artifacts/rolling-city-briefs/*.md
            engine/artifacts/ten-city-muhurat-time-grid-UNAPPROVED.json
            engine/artifacts/ten-city-muhurat-sourced-screening-UNAPPROVED.json
          retention-days: 14
          if-no-files-found: error
