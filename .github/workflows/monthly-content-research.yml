name: PANCHAVANI next-month content research (NO PUBLICATION)
on:
  schedule:
    - cron: '17 03 15 * *'
  workflow_dispatch:
    inputs:
      month:
        description: Month YYYY-MM; empty means next month in India
        required: false
        default: ''
        type: string
  push:
    paths:
      - '.github/workflows/monthly-content-research.yml'
      - 'engine/panchavani/monthly_content_pipeline.py'
      - 'engine/tests/test_monthly_content_pipeline.py'
  pull_request:
    paths:
      - '.github/workflows/monthly-content-research.yml'
      - 'engine/panchavani/monthly_content_pipeline.py'
      - 'engine/tests/test_monthly_content_pipeline.py'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  monthly-research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check complete-month research and release safety regressions
        run: |
          cd engine
          python -m unittest discover -s tests -p 'test_monthly_content_pipeline.py' -v
          python -m unittest discover -s tests -p 'test_ten_city_six_limb_research.py' -v
          python -m unittest discover -s tests -p 'test_swiss_exact_phase_roots.py' -v
          python -m unittest discover -s tests -p 'test_nightly_accuracy_gate.py' -v
      - name: Determine next month by IST, with strictly validated manual override
        id: month
        env:
          REQUESTED_MONTH: ${{ inputs.month || '' }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime,date
          from zoneinfo import ZoneInfo
          override=os.environ.get('REQUESTED_MONTH','').strip()
          if override:
              from pathlib import Path
              import sys
              sys.path.insert(0,str(Path('engine').resolve()))
              from panchavani.monthly_content_pipeline import month_days
              month_days(override)
              month=override
          else:
              current=datetime.now(ZoneInfo('Asia/Kolkata'))
              month=f"{current.year+int(current.month==12):04d}-{current.month%12+1:02d}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('value='+month+'\n')
          print('PANCHAVANI upcoming IST research month:',month)
          PY
      - name: Install pinned astronomy dependencies
        run: |
          pip install -r engine/requirements.txt
          pip install 'pyswisseph==2.10.3.2'
      - name: Fetch hash-pinned JPL DE440s
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 240 --silent --show-error \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp \
            --output /tmp/de440s.bsp
          echo 'c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2  /tmp/de440s.bsp' | sha256sum --check
      - name: Fetch hash-pinned independent Swiss ephemerides
        run: |
          set -euo pipefail
          mkdir -p /tmp/swiss-ephe
          for name in sepl_18.se1 semo_18.se1; do
            curl --fail --location --retry 3 --max-time 180 --silent --show-error \
              "https://raw.githubusercontent.com/aloistr/swisseph/master/ephe/$name" \
              --output "/tmp/swiss-ephe/$name"
          done
          echo "ca1393ceab3a44fbc895887cf789c68819ae6a1cbc9b22225872dbe4ccd99a66  /tmp/swiss-ephe/sepl_18.se1" | sha256sum --check
          echo "1ca07bd67c24374d77226180c20a4f9996cba013697894810518e7eb582ca4f7  /tmp/swiss-ephe/semo_18.se1" | sha256sum --check
      - name: Compute and cross-check every two-day ten-city cohort
        env:
          PANCHAVANI_SWISS_EPHE_PATH: /tmp/swiss-ephe
          RESEARCH_MONTH: ${{ steps.month.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p engine/artifacts/monthly-batches engine/artifacts/monthly-grids engine/artifacts/monthly-swiss engine/artifacts/monthly-qa
          for start in $(PYTHONPATH=engine python -c 'import os; from panchavani.monthly_content_pipeline import batch_starts; print(" ".join(batch_starts(os.environ["RESEARCH_MONTH"])))'); do
            echo "::group::JPL+Swiss research for cohort $start"
            PYTHONPATH=engine python -m panchavani.first_six_limb_pilot \
              --cities ten --start "$start" --ephemeris /tmp/de440s.bsp \
              --out "engine/artifacts/monthly-batches/batch-$start.json"
            PYTHONPATH=engine python -m panchavani.muhurat_windows \
              --batch "engine/artifacts/monthly-batches/batch-$start.json" \
              --out "engine/artifacts/monthly-grids/grid-$start.json"
            PYTHONPATH=engine python -m panchavani.swiss_exact_phase_roots \
              --cities ten --grid "engine/artifacts/monthly-grids/grid-$start.json" \
              --out "engine/artifacts/monthly-swiss/swiss-$start.json"
            PYTHONPATH=engine python -m panchavani.nightly_accuracy_gate \
              --swiss "engine/artifacts/monthly-swiss/swiss-$start.json" \
              --out "engine/artifacts/monthly-qa/qa-$start.json"
            echo "::endgroup::"
          done
      - name: Compose factual day and month private editorial briefs
        env:
          RESEARCH_MONTH: ${{ steps.month.outputs.value }}
        run: |
          PYTHONPATH=engine python -m panchavani.monthly_content_pipeline \
            --month "$RESEARCH_MONTH" \
            --batches-dir engine/artifacts/monthly-batches \
            --out engine/artifacts/monthly-content-UNAPPROVED.json \
            --briefs-dir engine/artifacts/monthly-private-briefs
      - name: Enforce complete coverage, independent numerical gate and zero SEO publication
        env:
          RESEARCH_MONTH: ${{ steps.month.outputs.value }}
        run: |
          python - <<'PY'
          import os,json,hashlib,calendar
          from pathlib import Path
          root=Path('engine/artifacts')
          report=json.loads((root/'monthly-content-UNAPPROVED.json').read_text())
          month=os.environ['RESEARCH_MONTH']
          year,month_number=map(int,month.split('-'))
          count=calendar.monthrange(year,month_number)[1]
          assert report['month']==month and report['cityDays']==10*count
          assert report['dailyResearchBriefs']==10*count and report['monthlyResearchBriefs']==10
          assert report['sourceBatches'] and len(report['sourceBatches'])==(count+1)//2
          assert report['eligibleIndexableUrls']==0 and report['publicPagesCreated']==0
          assert report['aiDraftsCreated']==0 and report['approvedClaimsForDeepSeek']==[]
          for key in ('publicationAuthorized','indexingAuthorized','modelInvocationAuthorized','scientificApproval','muhuratRecommendationsAuthorized'):
              assert report[key] is False,key
          for row in report['records']:
              assert row['publicationAuthorized'] is False
              assert row['indexingAuthorized'] is False
              file=root/'monthly-private-briefs'/row['dayBriefPath']
              assert hashlib.sha256(file.read_bytes()).hexdigest()==row['dayBriefSha256']
              assert "UNAPPROVED" in file.read_text()
          max_error=0
          for source in report['sourceBatches']:
              d=source['startDate']
              raw=(root/'monthly-batches'/f'batch-{d}.json').read_bytes()
              assert hashlib.sha256(raw).hexdigest()==source['batchSha256']
              qa=json.loads((root/'monthly-qa'/f'qa-{d}.json').read_text())
              assert qa['numericAlertPassed'] is True
              assert qa['publicationAuthorized'] is False
              assert qa['checkedCities']==10 and qa['checkedCityDays']==20
              max_error=max(max_error,qa['maxSwissVsJplDifferenceSeconds'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## PANCHAVANI next-month editorial research (PRIVATE ONLY)\n\n')
              out.write(f"**{month}** — {report['cityDays']} verified-structure JPL city-days, ")
              out.write(f"{report['dailyResearchBriefs']} daily briefs, {report['monthlyResearchBriefs']} monthly overviews.\n\n")
              out.write(f"Swiss/JPL max observed phase difference across cohorts: **{max_error:.3f} seconds**.\n\n")
              out.write('**0 publicly released calendar pages, 0 sitemap changes, 0 AI charges.** ')
              out.write('All dates, region-specific rules, astronomy conventions and prose require independent review.\n')
          print('PASS: whole-month ten-city research corpus is complete and NOT indexable')
          PY
      - name: Archive research outputs on GitHub only (no Cloudflare deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panchavani-next-month-content-UNAPPROVED
          path: |
            engine/artifacts/monthly-content-UNAPPROVED.json
            engine/artifacts/monthly-private-briefs/
            engine/artifacts/monthly-qa/
          retention-days: 30
          if-no-files-found: warn
