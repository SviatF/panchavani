name: PANCHAVANI nightly astronomy research (UNAPPROVED)
on:
  push:
    paths:
      - '.github/workflows/autonomous-research.yml'
      - 'engine/panchavani/astronomy.py'
      - 'engine/panchavani/core.py'
      - 'engine/panchavani/compute.py'
      - 'engine/panchavani/periods.py'
      - 'engine/panchavani/research_batch.py'
      - 'engine/panchavani/sidereal.py'
      - 'engine/panchavani/sidereal_batch.py'
  schedule:
    # Daily: generates research candidates; NEVER publishes pages or Muhurat.
    - cron: '17 02 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: panchavani-nightly-research
  cancel-in-progress: false
jobs:
  compute-private-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline unit tests including Karana and daytime intervals
        run: cd engine && python -m unittest discover -s tests -v
      - name: Install pinned Skyfield
        run: pip install -r engine/requirements.txt
      - name: Download NASA JPL DE440s and verify immutable checksum
        run: |
          curl --fail --location --retry 3 --max-time 240 --silent --show-error \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp \
            --output /tmp/de440s.bsp
          echo 'c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2  /tmp/de440s.bsp' | sha256sum --check
      - name: Generate two-day research dataset for EIGHT locations
        run: |
          PYTHONPATH=engine python -m panchavani.research_batch \
            --ephemeris /tmp/de440s.bsp \
            --out engine/artifacts/nightly \
            --days 2
      - name: Compute eight-city Nakshatra/Yoga using unvalidated Lahiri research model
        run: |
          PYTHONPATH=engine python -m panchavani.sidereal_batch \
            --ephemeris /tmp/de440s.bsp \
            --out engine/artifacts/nightly/sidereal/ \
            --days 2
      - name: Verify independent sidereal research stays blocked from SEO
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('engine/artifacts/nightly/sidereal')
          report=json.loads((root/'index-UNAPPROVED.json').read_text())
          assert report['status']=='RESEARCH_ONLY'
          assert report['cityCount']==8 and report['days']==2
          assert len(report['candidates'])==16
          assert report['publicReleaseAllowed'] is False
          assert report['independentScientificValidation']=='NOT_COMPLETED'
          assert 'UNVALIDATED' in report['method']
          assert report['crossCityGeocentricConsistency']=='PASSED'
          assert all((root/c['file']).is_file() for c in report['candidates'])
          print('PASS: 16 sidereal research files; ZERO public releases')
          PY
      - name: Enforce fail-closed, no publication from nightly results
        run: |
          python - <<'PY'
          import json,pathlib
          out=pathlib.Path('engine/artifacts/nightly')
          report=json.loads((out/'research-report.json').read_text())
          assert report['cityCount']==8 and report['days']==2
          assert len(report['candidates'])==16
          assert report['researchOnly'] is True
          assert report['publicReleaseAllowed'] is False
          assert report['indexableCityPagesCreated']==0
          for c in report['candidates']:
              assert c['status']=='UNAPPROVED' and c['publicationBlockers']>0
              assert c['seoGateBlockers'] and 'not-explicitly-approved' in c['seoGateBlockers']
              p=out/c['file']
              assert p.exists()
          print('PASS: complete city/date research set; 0 indexable pages, 0 releases')
          PY
      - name: Archive ONLY private research outputs for later scientific review
        uses: actions/upload-artifact@v4
        with:
          name: panchavani-nightly-candidates-NOT-APPROVED
          path: engine/artifacts/nightly/
          retention-days: 7
          if-no-files-found: error
