name: PANCHAVANI private Admin Worker safe auto-deploy (on main only)
on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - '.github/workflows/deploy-private-admin.yml'
  pull_request:
    paths:
      - 'admin/**'
      - '.github/workflows/deploy-private-admin.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: panchavani-private-admin-production
  cancel-in-progress: false
jobs:
  production-admin-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Private Admin full tests and dry-run before deploying anything
        run: |
          cd admin
          npm install --no-audit --no-fund
          npm run check
      - name: Confirm Cloudflare Worker deploy authentication is available
        id: auth
        run: |
          if test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Private Admin Worker authenticated deployment is enabled'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'MISSING CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID: live deployment was NOT attempted'
          fi
      - name: Fail main-branch deployment when required Cloudflare secrets are missing
        if: github.ref == 'refs/heads/main' && steps.auth.outputs.ready != 'true'
        run: |
          echo 'BLOCKED: GitHub Actions is missing Cloudflare credentials. The Admin Worker was NOT deployed.' >&2
          exit 1
      - name: Apply strictly additive private D1 review and editorial migrations
        if: github.ref == 'refs/heads/main' && steps.auth.outputs.ready == 'true'
        run: |
          cd admin
          npx wrangler d1 migrations apply panchavani-private --remote --config wrangler.jsonc
      - name: Deploy ONLY protected private Admin Worker to existing Cloudflare account
        id: deploy
        if: github.ref == 'refs/heads/main' && steps.auth.outputs.ready == 'true'
        run: |
          cd admin
          npx wrangler deploy --config wrangler.jsonc
          echo 'deployed=true' >> "$GITHUB_OUTPUT"
      - name: Record deployment truth (no claims about D1/Access health)
        if: always()
        env:
          HAS_CREDENTIALS: ${{ steps.auth.outputs.ready }}
          DEPLOYED: ${{ steps.deploy.outputs.deployed }}
          IS_MAIN_BRANCH: ${{ github.ref == 'refs/heads/main' }}
          JOB_RESULT: ${{ job.status }}
        run: |
          echo '## PANCHAVANI PRIVATE Admin automatic deployment' >> "$GITHUB_STEP_SUMMARY"
          if test "$IS_MAIN_BRANCH" != true; then
            echo '**NOT DEPLOYED:** Pull request validation cannot modify the production Worker.' >> "$GITHUB_STEP_SUMMARY"
          elif test "$DEPLOYED" = true; then
            echo '**WRANGLER DEPLOYED:** private Admin Worker script updated in Cloudflare. Access and the next real D1/R2 scheduled forensic snapshot still require live verification.' >> "$GITHUB_STEP_SUMMARY"
          elif test "$HAS_CREDENTIALS" != true; then
            echo '**NOT DEPLOYED, MAIN JOB FAILED:** GitHub Cloudflare credentials unavailable. Source-code checks do not prove production deployment.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '**DEPLOY FAILED:** See explicit Wrangler or test failure above. Never assume private Cron is active.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'No public site, sitemap or indexing settings were changed by this workflow.' >> "$GITHUB_STEP_SUMMARY"
