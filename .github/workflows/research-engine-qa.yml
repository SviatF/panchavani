name: Private calculation and admin QA
on:
  push:
    paths:
      - 'engine/**'
      - 'admin/**'
      - '.github/workflows/research-engine-qa.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'admin/**'
      - '.github/workflows/research-engine-qa.yml'
permissions:
  contents: read
jobs:
  mathematics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline numerical invariants (never claim reference accuracy)
        run: cd engine && python -m unittest discover -s tests -v
      - name: Validate Python module syntax
        run: python -m compileall -q engine/panchavani engine/tests
      - name: Validate private D1 migrations and research-only schema invariants
        run: |
          python - <<'PY'
          import sqlite3, pathlib
          con=sqlite3.connect(':memory:')
          con.execute('PRAGMA foreign_keys=ON')
          for p in sorted(pathlib.Path('admin/migrations').glob('*.sql')):
              con.executescript(p.read_text())
          con.execute("INSERT INTO job_requests(id,city_id,local_date,status,requested_by) VALUES('id1','delhi','2026-10-13','queued','test@example.com')")
          con.execute("INSERT INTO research_candidates(id,job_id,city_id,local_date,content_hash,r2_key,blocker_count) VALUES('id2','id1','delhi','2026-10-13',?, 'unapproved/test.json', 4)", ('a'*64,))
          try:
              con.execute("UPDATE research_candidates SET status='published' WHERE id='id2'")
          except sqlite3.IntegrityError:
              pass
          else:
              raise AssertionError('PRIVATE research table allowed published status')
          # Autonomy slots must reference an actual queued job, never
          # authorize public calendar data or create duplicate city/date jobs.
          con.execute("INSERT INTO job_requests(id,city_id,local_date,status,requested_by) VALUES('auto-job','delhi','2026-10-16','queued','panchavani-cron@internal')")
          con.execute("INSERT INTO autonomous_research_slots(city_id,local_date,job_id) VALUES('delhi','2026-10-16','auto-job')")
          duplicate=con.execute("INSERT OR IGNORE INTO autonomous_research_slots(city_id,local_date,job_id) VALUES('delhi','2026-10-16','auto-job')").rowcount
          assert duplicate==0
          con.execute("INSERT INTO autonomous_ai_slots(job_id,intent,language,prompt_version,status) VALUES('auto-job','daily-panchang','en','v1','processing')")
          assert con.execute("SELECT COUNT(*) FROM autonomous_ai_slots").fetchone()[0]==1
          try:
              con.execute("INSERT INTO autonomous_ai_slots(job_id,intent,language,prompt_version,status) VALUES('auto-job','daily-panchang','en','v1','published')")
          except sqlite3.IntegrityError:
              pass
          else:
              raise AssertionError('Autonomous research AI table permitted an invalid release status')
          con.execute("INSERT INTO editorial_one_shot(city_id,local_date,intent,language,job_id,source_hash,policy_version,requested_by,status) VALUES('delhi','2026-10-16','daily-panchang','en','auto-job',?,'v2','test@example.com','reserved')", ('a'*64,))
          rowcount=con.execute("INSERT OR IGNORE INTO editorial_one_shot(city_id,local_date,intent,language,job_id,source_hash,policy_version,requested_by,status) VALUES('delhi','2026-10-16','daily-panchang','en','auto-job',?,'v3','test@example.com','reserved')", ('a'*64,)).rowcount
          assert rowcount==0, 'One-shot must survive policy/model upgrades without a second paid attempt'
          try:
              con.execute("UPDATE editorial_one_shot SET status='published' WHERE city_id='delhi'")
          except sqlite3.IntegrityError:
              pass
          else:
              raise AssertionError('One-shot row permitted published status')
          con.execute("INSERT INTO private_research_handoff_slots(city_id,local_date,job_id,candidate_sha256,status,imported_by) VALUES('delhi','2026-10-16','auto-job',?,'reserved','owner@example.test')", ('b'*64,))
          dup=con.execute("INSERT OR IGNORE INTO private_research_handoff_slots(city_id,local_date,job_id,candidate_sha256,status,imported_by) VALUES('delhi','2026-10-16','auto-job',?,'reserved','owner@example.test')", ('b'*64,)).rowcount
          assert dup==0, 'Import slot must never be paid or stored twice'
          try:
              con.execute("UPDATE private_research_handoff_slots SET status='approved' WHERE city_id='delhi'")
          except sqlite3.IntegrityError:
              pass
          else:
              raise AssertionError('Import cannot directly approve or publish a candidate')
          combined=pathlib.Path('admin/ops/enable-three-city-pilot.sql').read_text()
          source4=pathlib.Path('admin/migrations/0004_one_shot_editorial.sql').read_text().strip()
          source5=pathlib.Path('admin/migrations/0005_private_handoff.sql').read_text().strip()
          assert source4 in combined and source5 in combined
          assert combined.index(source4)<combined.index(source5)
          testdb=sqlite3.connect(':memory:')
          testdb.execute('PRAGMA foreign_keys=ON')
          for p in ('admin/migrations/0001_private_jobs.sql','admin/migrations/0002_private_runner.sql','admin/migrations/0003_autonomous_research.sql'):
              testdb.executescript(pathlib.Path(p).read_text())
          testdb.executescript(combined)
          testdb.executescript(combined) # must be idempotent
          rows=testdb.execute("SELECT name FROM sqlite_master WHERE type='table' AND name IN ('job_requests','research_candidates','editorial_one_shot','private_research_handoff_slots')").fetchall()
          assert len(rows)==4, 'Consolidated migration failed to install required tables'
          # Atomic cross-date evergreen reservation: one city/language guide
          # can never trigger another billable attempt on a different date.
          testdb.execute("INSERT INTO job_requests(id,city_id,local_date,status,requested_by) VALUES('seo-a','mumbai','2026-10-16','candidate','owner')")
          testdb.execute("INSERT INTO job_requests(id,city_id,local_date,status,requested_by) VALUES('seo-b','mumbai','2026-10-17','candidate','owner')")
          sql="""INSERT OR IGNORE INTO editorial_one_shot
            (city_id,local_date,intent,language,job_id,source_hash,policy_version,requested_by,status)
            SELECT ?,?,?,?,?,?,?,?,'reserved'
            WHERE NOT EXISTS (SELECT 1 FROM editorial_one_shot
              WHERE city_id=? AND intent='city-hub' AND language=?)"""
          a=('mumbai','2026-10-16','city-hub','en','seo-a','a'*64,'v4','owner','mumbai','en')
          b=('mumbai','2026-10-17','city-hub','en','seo-b','b'*64,'v4','owner','mumbai','en')
          assert testdb.execute(sql,a).rowcount==1
          assert testdb.execute(sql,b).rowcount==0
          assert testdb.execute("SELECT COUNT(*) FROM editorial_one_shot WHERE city_id='mumbai' AND intent='city-hub'").fetchone()[0]==1
          print('PASS: migrations, autonomous and one-shot idempotency, locked handoff, zero release status')

          PY
  private-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install private Worker dependencies
        run: cd admin && npm install --no-audit --no-fund
      - name: Check protected Worker syntax and deploy bundle (dry-run only)
        run: cd admin && npm run check
