name: Verify static Next.js build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out project and original generated WebP assets
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify all 17 research briefs are evidence-pending, not published content
        run: |
          PYTHONPATH=engine python -m panchavani.editorial_quality
          cd engine && python -m unittest discover -s tests -p 'test_editorial_quality.py' -v
          python -m unittest discover -s tests -p 'test_ai_editorial.py' -v
      - name: Verify hard city-day evidence, near-duplicate and four-limb page gates
        run: npm run test:preindex
      - name: Display truthful release readiness without opening indexing
        run: npm run audit:preindex
      - name: Audit real public city texts for naturalness, useful reading tasks and distinct SEO snippets
        run: npm run audit:content
      - name: Verify ten-city UX, substantive Muhurat methods and zero unapproved recommendations
        run: npm run test:product
      - name: Build static site
        run: npm run build
      - name: Verify generated routes and media
        run: |
          test -f out/index.html
          test -f out/panchang/index.html
          test -f out/muhurat/wedding/index.html
          test -f out/festivals/dussehra/index.html
          test -f out/imgs/hero-main-bg.webp
          test -f out/imgs/card-start-business.webp
          test -f out/imgs/logo.webp
          test -f out/imgs/region-uttar-pradesh.webp
          test -f out/imgs/region-maharashtra.webp
          test -f out/imgs/region-tamil-nadu.webp
          test -f out/imgs/region-karnataka.webp
          test -f out/imgs/region-gujarat.webp
          test -f out/imgs/favicon_gold_frame.ico
          grep -q 'favicon_gold_frame.ico' out/index.html
          grep -qi 'noindex' out/index.html
      - name: Verify exactly ten educational city pages indexable and all unapproved science remains noindex
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from xml.etree import ElementTree
          import json
          names=('delhi','mumbai','kolkata','chennai','bengaluru','hyderabad','ahmedabad','pune','jaipur','varanasi')
          expected={'https://panchavani.com/panchang/'+city+'/' for city in names}
          routes=list(Path('out').rglob('*.html'))
          assert routes, 'No static HTML built'
          class Meta(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.robots=[]
                  self.canonical=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='meta' and a.get('name')=='robots':
                      self.robots.append(a.get('content',''))
                  if tag=='link' and a.get('rel')=='canonical':
                      self.canonical.append(a.get('href',''))
          indexable=set()
          for path in routes:
              p=Meta();p.feed(path.read_text(encoding='utf-8'))
              rel=path.relative_to('out').as_posix()
              expected_index=rel in {'panchang/'+city+'/index.html' for city in names}
              if expected_index:
                  city=rel.split('/')[1]
                  assert p.canonical==['https://panchavani.com/panchang/'+city+'/'],(rel,p.canonical)
                  assert len(p.robots)==1 and 'noindex' not in p.robots[0].lower() and 'index' in p.robots[0].lower(),(rel,p.robots)
                  indexable.add('https://panchavani.com/panchang/'+city+'/')
              else:
                  assert p.robots and all('noindex' in x.lower() for x in p.robots),(rel,p.robots)
                  assert not (rel.startswith('panchang/') and rel.count('/')>2), 'Unreviewed daily calendar page leaked: '+rel
          assert indexable==expected,(indexable,expected)
          root=ElementTree.parse('out/sitemap.xml').getroot()
          urls={n.text for n in root.iter() if n.tag.endswith('}loc') or n.tag=='loc'}
          assert urls==expected,(urls,expected)
          assert len(list(root.iter()))>=10
          assert 'sitemap.xml' in Path('out/robots.txt').read_text().lower()
          bundle=json.loads(Path('data/approved-panchang.json').read_text())
          assert bundle['records']==[] and bundle['releaseStatus']=='NO_APPROVED_RECORDS'
          assert len({Path('out/panchang',c,'index.html').read_bytes() for c in names})==10,'Repeated city HTML'
          for c in names:
              text=Path('out/panchang',c,'index.html').read_text().lower()
              assert c in text and 'practical reader question' in text and 'source and method references' in text,c
          print('PASS: exactly 10 educational city URLs index/follow and sitemap, all other HTML noindex, 0 unapproved day pages')
          PY
      - name: Reject legacy mocked calendar dates and preview labels in public HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden = [
              'VISUAL DESIGN PREVIEW', 'Delhi design preview',
              'Tuesday, 13 October 2026', '13 October 2026',
              '20 October 2026', 'Vishakha', 'Shukla Paksha',
              'Current Planetary Position', 'Calculated values coming soon',
          ]
          for path in Path('out').rglob('*.html'):
              content=path.read_text(encoding='utf-8')
              leaked=[word for word in forbidden if word.casefold() in content.casefold()]
              assert not leaked, f'{path}: outdated or fabricated content: {leaked}'
          print('PASS: no legacy preview, false calendar date or unsupported planetary claims')
          PY
      - name: Validate Wrangler assets-only deployment configuration (dry run)
        run: npx wrangler deploy --dry-run
