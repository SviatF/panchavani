name: Verify static Next.js build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out project and original generated WebP assets
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify all 17 research briefs are evidence-pending, not published content
        run: |
          PYTHONPATH=engine python -m panchavani.editorial_quality
          cd engine && python -m unittest discover -s tests -p 'test_editorial_quality.py' -v
          python -m unittest discover -s tests -p 'test_ai_editorial.py' -v
      - name: Verify hard city-day evidence, near-duplicate and four-limb page gates
        run: npm run test:preindex
      - name: Display truthful release readiness without opening indexing
        run: npm run audit:preindex
      - name: Audit real public city texts for naturalness, useful reading tasks and distinct SEO snippets
        run: npm run audit:content
      - name: Build static site
        run: npm run build
      - name: Verify generated routes and media
        run: |
          test -f out/index.html
          test -f out/panchang/index.html
          test -f out/muhurat/wedding/index.html
          test -f out/festivals/dussehra/index.html
          test -f out/imgs/hero-main-bg.webp
          test -f out/imgs/card-start-business.webp
          test -f out/imgs/logo.webp
          test -f out/imgs/region-uttar-pradesh.webp
          test -f out/imgs/region-maharashtra.webp
          test -f out/imgs/region-tamil-nadu.webp
          test -f out/imgs/region-karnataka.webp
          test -f out/imgs/region-gujarat.webp
          test -f out/imgs/favicon_gold_frame.ico
          grep -q 'favicon_gold_frame.ico' out/index.html
          grep -qi 'noindex' out/index.html
      - name: Fail closed if ANY static HTML route accidentally becomes indexable
        run: |
          python - <<'PY'
          from pathlib import Path
          routes=list(Path('out').rglob('*.html'))
          assert routes, 'No HTML files found'
          missing=[p.as_posix() for p in routes if 'noindex' not in p.read_text(encoding='utf-8').lower()]
          assert not missing, 'UNREVIEWED PUBLIC INDEXING: '+str(missing)
          print('PASS:', len(routes), 'static routes remain noindex until scientific/editorial release gate')
          PY
      - name: Verify public sitemap contains ZERO unapproved/noindex URLs
        run: |
          test -f out/sitemap.xml
          test -f out/robots.txt
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          page=Path('out/sitemap.xml')
          root=ElementTree.parse(page).getroot()
          locs=[n.text for n in root.iter() if n.tag.endswith('}loc') or n.tag=='loc']
          assert not locs, f'UNAPPROVED sitemap entries: {locs}'
          assert 'sitemap.xml' in Path('out/robots.txt').read_text().lower()
          print('PASS: valid empty sitemap, no draft/day URLs indexed')
          PY
      - name: Verify three genuinely distinct city hubs and no unapproved daily URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from html import unescape
          bundle=json.loads(Path('data/approved-panchang.json').read_text())
          assert bundle['records']==[], 'Public records must remain empty until external approval'
          assert bundle['releaseStatus']=='NO_APPROVED_RECORDS'
          paths=[Path('out/panchang')/city/'index.html' for city in ('delhi','mumbai','chennai')]
          for city,path in zip(('delhi','mumbai','chennai'),paths):
              assert path.is_file(), f'Missing city hub {city}'
              text=unescape(path.read_text()).lower()
              assert city in text and 'noindex' in text, f'City hub unsafe: {city}'
          assert len(set(p.read_bytes() for p in paths))==3, 'Duplicate city HTML'
          for path in Path('out/panchang').rglob('index.html'):
              rel=path.relative_to('out/panchang').parts
              assert len(rel)<=2, 'Unapproved daily date HTML: '+str(path)
          print('PASS: 3 unique research-ready city hubs, zero falsely approved daily routes')
          PY
      - name: Reject legacy mocked calendar dates and preview labels in public HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden = [
              'VISUAL DESIGN PREVIEW', 'Delhi design preview',
              'Tuesday, 13 October 2026', '13 October 2026',
              '20 October 2026', 'Vishakha', 'Shukla Paksha',
              'Current Planetary Position', 'Calculated values coming soon',
          ]
          for path in Path('out').rglob('*.html'):
              content=path.read_text(encoding='utf-8')
              leaked=[word for word in forbidden if word.casefold() in content.casefold()]
              assert not leaked, f'{path}: outdated or fabricated content: {leaked}'
          print('PASS: no legacy preview, false calendar date or unsupported planetary claims')
          PY
      - name: Validate Wrangler assets-only deployment configuration (dry run)
        run: npx wrangler deploy --dry-run
