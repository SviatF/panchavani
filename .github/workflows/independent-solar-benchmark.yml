name: PANCHAVANI independent Delhi solar benchmark (RESEARCH ONLY)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/independent-solar-benchmark.yml'
      - 'engine/panchavani/lahiri_reference.py'
      - 'engine/tests/test_lahiri_reference.py'
      - 'engine/panchavani/lahiri_transition_sensitivity.py'
      - 'engine/tests/test_lahiri_transition_sensitivity.py'
      - 'engine/panchavani/swiss_exact_phase_roots.py'
      - 'engine/tests/test_swiss_exact_phase_roots.py'
      - 'engine/panchavani/reference_coverage.py'
      - 'engine/tests/test_reference_coverage.py'
      - 'engine/panchavani/reference_discrepancy.py'
      - 'engine/tests/test_reference_discrepancy.py'
      - 'engine/fixtures/delhi-2026-10-21-independent-timings-UNAPPROVED.json'
  pull_request:
    paths:
      - '.github/workflows/independent-solar-benchmark.yml'
      - 'engine/fixtures/delhi-2026-10-21-independent-timings-UNAPPROVED.json'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test external evidence coverage safeguards
        run: |
          cd engine
          python -m unittest discover -s tests -p 'test_reference_coverage.py' -v
          python -m unittest discover -s tests -p 'test_reference_discrepancy.py' -v
          python -m unittest discover -s tests -p 'test_lahiri_reference.py' -v
          python -m unittest discover -s tests -p 'test_lahiri_transition_sensitivity.py' -v
          python -m unittest discover -s tests -p 'test_swiss_exact_phase_roots.py' -v
      - name: Install pinned dependencies
        run: pip install -r engine/requirements.txt
      - name: Install independent Swiss Ephemeris comparison library
        run: pip install 'pyswisseph==2.10.3.2'
      - name: Download and hash-check JPL DE440s ephemeris
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 240 --silent --show-error \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp \
            --output /tmp/de440s.bsp
          echo 'c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2  /tmp/de440s.bsp' | sha256sum --check
      - name: Independently compare provisional Lahiri against Swiss reference across seasons
        run: |
          PYTHONPATH=engine python -m panchavani.lahiri_reference \
            --ephemeris /tmp/de440s.bsp \
            --out engine/artifacts/lahiri-independent-comparison-UNAPPROVED.json
      - name: Calculate real October 21-22 ten-city sunrise records
        run: |
          PYTHONPATH=engine python -m panchavani.first_six_limb_pilot \
            --cities ten --start 2026-10-21 --ephemeris /tmp/de440s.bsp \
            --out engine/artifacts/solar-benchmark-source-UNAPPROVED.json
      - name: Form complete JPL time grid
        run: |
          PYTHONPATH=engine python -m panchavani.muhurat_windows \
            --batch engine/artifacts/solar-benchmark-source-UNAPPROVED.json \
            --out engine/artifacts/solar-benchmark-grid-UNAPPROVED.json
      - name: Quantify first-order Lahiri impact on real Nakshatra/Yoga boundaries
        run: |
          PYTHONPATH=engine python -m panchavani.lahiri_transition_sensitivity \
            --ephemeris /tmp/de440s.bsp \
            --grid engine/artifacts/solar-benchmark-grid-UNAPPROVED.json \
            --out engine/artifacts/lahiri-transition-sensitivity-UNAPPROVED.json
      - name: Fetch independent Swiss planetary and lunar ephemeris files
        run: |
          set -euo pipefail
          mkdir -p /tmp/swiss-ephe
          for name in sepl_18.se1 semo_18.se1; do
            curl --fail --location --retry 3 --max-time 180 --silent --show-error \
              "https://raw.githubusercontent.com/aloistr/swisseph/master/ephe/$name" \
              --output "/tmp/swiss-ephe/$name"
            test "$(stat -c %s "/tmp/swiss-ephe/$name")" -gt 100000
            sha256sum "/tmp/swiss-ephe/$name"
          echo "ca1393ceab3a44fbc895887cf789c68819ae6a1cbc9b22225872dbe4ccd99a66  /tmp/swiss-ephe/sepl_18.se1" | sha256sum --check
          echo "1ca07bd67c24374d77226180c20a4f9996cba013697894810518e7eb582ca4f7  /tmp/swiss-ephe/semo_18.se1" | sha256sum --check
          done
      - name: Independently solve Swiss sidereal Nakshatra Yoga transitions
        env:
          PANCHAVANI_SWISS_EPHE_PATH: /tmp/swiss-ephe
        run: |
          PYTHONPATH=engine python -m panchavani.swiss_exact_phase_roots \
            --grid engine/artifacts/solar-benchmark-grid-UNAPPROVED.json \
            --out engine/artifacts/swiss-exact-sidereal-roots-UNAPPROVED.json
      - name: Compare independently documented solar readings
        run: |
          PYTHONPATH=engine python -m panchavani.reference_accuracy \
            --grid engine/artifacts/solar-benchmark-grid-UNAPPROVED.json \
            --references engine/fixtures/delhi-2026-10-21-independent-timings-UNAPPROVED.json \
            --out engine/artifacts/delhi-2026-10-21-reference-errors-UNAPPROVED.json
      - name: Quantify ten-city reference evidence gaps
        run: |
          PYTHONPATH=engine python -m panchavani.reference_coverage \
            --benchmark engine/artifacts/delhi-2026-10-21-reference-errors-UNAPPROVED.json \
            --out engine/artifacts/delhi-2026-10-21-coverage-UNAPPROVED.json
      - name: Triage publisher-versus-JPL timing discrepancies
        run: |
          PYTHONPATH=engine python -m panchavani.reference_discrepancy \
            --benchmark engine/artifacts/delhi-2026-10-21-reference-errors-UNAPPROVED.json \
            --out engine/artifacts/delhi-2026-10-21-discrepancy-triage-UNAPPROVED.json
      - name: Assert expected provenance and fail-closed status
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('engine/artifacts/delhi-2026-10-21-reference-errors-UNAPPROVED.json')
          report=json.loads(p.read_text())
          coverage=json.loads(pathlib.Path('engine/artifacts/delhi-2026-10-21-coverage-UNAPPROVED.json').read_text())
          assert coverage['hasAllTenCityEventGroups'] is False
          assert coverage['sampleCountsByEvent']['tithi']==1
          assert coverage['sampleCountsByEvent']['karana']==2
          assert coverage['sampleCountsByEvent']['nakshatra']==1
          assert coverage['sampleCountsByEvent']['yoga']==1
          assert coverage['publicationAuthorized'] is False
          triage=json.loads(pathlib.Path('engine/artifacts/delhi-2026-10-21-discrepancy-triage-UNAPPROVED.json').read_text())
          assert triage['sampleCount']==7
          assert triage['overallMethodAccuracyCertified'] is False
          assert triage['publicationAuthorized'] is False
          assert report['sampleCount']==7
          print('OBSERVED NUMERICAL ERRORS (research-only):')
          for item in report['comparisons']:
            print(f"{item['cityId']} {item['localDate']} {item['kind']}: model={item['calculatedUtc']} reference={item['referenceUtc']} signed_error_seconds={item['signedErrorSeconds']} abs_error_seconds={item['absoluteErrorSeconds']} reference_resolution_seconds={item['referencePrecisionSeconds']}")
          for kind, metrics in report['metricsByKind'].items():
            print(f"AGGREGATE {kind}: {metrics}")
          assert report['coverageCityDays']==1
          assert set(report['metricsByKind'])=={'sunrise','sunset','tithi','karana','nakshatra','yoga'}
          assert report['scientificApproval'] is False
          assert report['publicationAuthorized'] is False
          assert report['indexingAuthorized'] is False
          assert report['muhuratRecommendationsAuthorized'] is False
          assert report['approvedClaimsForDeepSeek']==[]
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as out:
            out.write('## PANCHAVANI Delhi 2026-10-21 — independent solar timing research\n\n')
            out.write('| Event | Error (signed seconds) | Absolute error (seconds) | Source precision |\n|---|---:|---:|---:|\n')
            for row in report['comparisons']:
              out.write(f"| {row['kind']} | {row['signedErrorSeconds']} | {row['absoluteErrorSeconds']} | {row['referencePrecisionSeconds']}s |\n")
            out.write('\n**RESEARCH ONLY**: this benchmark does not establish comparable observer/refraction conventions or approve ritual dates.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: delhi-solar-reference-benchmark-UNAPPROVED
          path: |
            engine/artifacts/delhi-2026-10-21-reference-errors-UNAPPROVED.json
            engine/artifacts/delhi-2026-10-21-coverage-UNAPPROVED.json
            engine/artifacts/delhi-2026-10-21-discrepancy-triage-UNAPPROVED.json
            engine/artifacts/lahiri-independent-comparison-UNAPPROVED.json
            engine/artifacts/lahiri-transition-sensitivity-UNAPPROVED.json
            engine/artifacts/swiss-exact-sidereal-roots-UNAPPROVED.json
          retention-days: 14
          if-no-files-found: error
