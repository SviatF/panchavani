name: Private PANCHAVANI research queue runner (manual, no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: panchavani-private-research-consumer
  cancel-in-progress: false
jobs:
  consume-one-research-job:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PANCHAVANI_ADMIN_URL: https://admin.panchavani.com
      PANCHAVANI_RUNNER_HMAC_SECRET: ${{ secrets.PANCHAVANI_RUNNER_HMAC_SECRET }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.PANCHAVANI_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.PANCHAVANI_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require connected private resources; fail closed if absent
        run: |
          test -n "$PANCHAVANI_RUNNER_HMAC_SECRET"
          test -n "$CF_ACCESS_CLIENT_ID"
          test -n "$CF_ACCESS_CLIENT_SECRET"
      - name: Install astronomical dependencies
        run: python -m pip install -r engine/requirements.txt
      - name: Fetch pinned JPL DE440s ephemeris
        run: |
          curl --fail --location --retry 3 --max-time 240 --silent --show-error \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp \
            --output /tmp/panchavani-de440s.bsp
          echo 'c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2  /tmp/panchavani-de440s.bsp' | sha256sum --check
      - name: Consume one private queued candidate; no release endpoint
        run: |
          PYTHONPATH=engine python -m panchavani.private_runner --ephemeris /tmp/panchavani-de440s.bsp
